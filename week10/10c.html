<!DOCTYPE html>
<html>
    <body style="border: 4px solid black; padding: 20px;font-size: 24px;justify-content:center;text-align:center;">
        <script>
            for(let i=0;i<=15;i++){
                if(i%2==0){
                    document.write("The number " + i+" is even <br>");
                }
                else{
                    document.write("The number "+i+" is odd <br>");
                }
            }
        </script>
    </body>
</html>
