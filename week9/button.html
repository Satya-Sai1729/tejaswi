<!DOCTYPE html>
<html>
    <head>
        <style>
            #box{
                display: flex;
                gap: 20px;
            }

            button{
                padding: 10px;
                font-size: 30px;
            }

            #number{
                padding: 10px;
                font-size: 30px;
            }

            .container{
                justify-content: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 20px;
                border: 8px solid black;
                padding: 20px;
            }
        </style>

        <script>
    function even(){
        var num = document.getElementById("number").value;
        if(num % 2 == 0){
            alert(num + " is an even number.");
        } else {
            alert(num + " is not an even number.");
        }
    }

    function odd(){
        var num = document.getElementById("number").value;
        if(num % 2 != 0){
            alert(num + " is an odd number.");
        } else {
            alert(num + " is not an odd number.");
        }
    }

    function factorial(){
        var num = document.getElementById("number").value;
        var fact = 1;
        for(var i = 1; i <= num; i++){
            fact = fact * i;
        }
        alert("Factorial of " + num + " is " + fact);
    }   

    function prime() {
        var num = document.getElementById("number").value;
        var isPrime = true;
        if (num <= 1) {
            isPrime = false;
        } else {
            for (var i = 2; i <= num-1; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }
        if (isPrime) {
            alert(num + " is a prime number.");
        } else {
            alert(num + " is not a prime number.");
        }
    }

    function Armstrong() {
        var num=document.getElementById("number").value;
        var sum=0;
        var temp=num;
        var digits=num.toString().length;   
        while (temp > 0) {
            var mod = temp%10;
            sum+=Math.pow(mod, digits);
            temp=Math.floor(temp/10);
            }
        if (sum == num) {
            alert(num + " is an Armstrong number.");
        } else {
            alert(num + " is not an Armstrong number.");
        }
    }
    </script>
    </head>

    <body>
        <div class="container">
            <h2 style="align-items: center;font-size: 60px;;font-family: Arial, sans-serif;color:gold;text-shadow: 2px 2px 4px black;"> Number Operations</h2>
            <h4 style="border: 2px solid black; padding: 10px;">Enter the Number and Click on the corresponding button to get the result</h4>
            <input TYPE="text" id="number" placeholder="Enter a number"> <br><br>
            <div id="box">
                <button type="button" id="even" onclick="even()" style="background-color: lightblue;">Even No</button>
                <button type="button" id="odd" onclick="odd()" style="background-color: lightgreen;">Odd No</button>
                <button type="button" id="factorial" onclick="factorial()" style="background-color: lightyellow;">Factorial</button>
                <button type="button" id="prime" onclick="prime()" style="background-color: lightcoral;">Prime</button>
                <button type="button" id="Arm" onclick="Armstrong()" style="background-color: lightgray;">Armstrong</button>
            </div>
        </div>
    </body>
</html>
