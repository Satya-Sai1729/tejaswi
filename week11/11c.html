<!DOCTYPE html>
<html>
    <head>
        <title>Password Strength Validation</title>
         <style>
            body{
                min-height:100vh;
                margin:0;
            }
            input {
                padding: 8px;
                width: 250px;
                margin-top: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                size: 40px;
            }
            #msg {
                font-size: 24px;
                margin-top: 10px;
                font-style: normal;
            }
            div{
                justify-content:center;
                text-align:center;
                font-size: 36px;
            }
            h1{
                text-align:center;
                font-size: 48px;
                color: #eeee06;
                text-shadow: 2px 2px 4px #000000;
                font-family: 'Times New Roman', Times, serif;
            }
            #box {
                border: 2px solid black;
                margin: 20px;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div id="box">
            <h1><i>Password Strength Detecter</i></h1>
            <div>
                Password: <input type="password" id="pass" onkeyup="checkstrength()" placeholder="Enter password"><br>
                <p id="msg"></p>
            </div>
        </div>
        <script>
            function checkstrength(){
                let password=document.getElementById("pass").value;
                let msg=document.getElementById("msg");
                let strongpattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
                if(password.length===0){
                    msg.innerHTML="";
                }
                else if(strongpattern.test(password)){
                    msg.innerHTML="strong password";
                    msg.style.color="green";
                    msg.style.fontSize="24px";
                }
                else{
                    msg.innerHTML="weak password";
                    msg.style.color="red";
                    msg.style.fontSize="24px";
                }
            }
        </script>
    </body>
</html>
